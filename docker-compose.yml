services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
    mem_limit: 48m
    restart: unless-stopped

  fastapi:
    build: ./app
    container_name: edge_fastapi
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL=30
    depends_on:
      - redis
    mem_limit: 128m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edge_redis
    command: redis-server --maxmemory 80mb --maxmemory-policy allkeys-lru
    mem_limit: 80m
    restart: unless-stopped

networks:
  default:
    name: edge
